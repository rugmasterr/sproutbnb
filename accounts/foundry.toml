[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
cache_path = "cache"
libs = ["../contracts/lib"]
allow_paths = ["../contracts/lib"]
evm_version = "cancun"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
# deterministic bytecode (no metadata hash) => stable CREATE2 / fixture addresses across machines
bytecode_hash = "none"
cbor_metadata = false

# Same code, but the local test EVM runs Osaka, which has the native P256VERIFY precompile (EIP-7951) at 0x100.
# FOUNDRY_PROFILE=osaka forge test
[profile.osaka]
evm_version = "osaka"

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"
bsc_testnet = "${BSC_TESTNET_RPC_URL}"

[fuzz]
runs = 64

[lint]
lint_on_build = false
